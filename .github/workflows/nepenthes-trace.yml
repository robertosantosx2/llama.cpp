name: NEPENTHES runtime trace

on:
  pull_request:
    paths:
      - "src/nepenthes_trace.hpp"
      - "src/nepenthes_jsonl_sink.hpp"
      - "src/nepenthes_jsonl_sink.cpp"
      - "src/llama-model-loader.cpp"
      - "src/llama-model.cpp"
      - "src/CMakeLists.txt"
      - "ggml/include/ggml-nepenthes.hpp"
      - "ggml/include/ggml-nepenthes-c.h"
      - "ggml/src/ggml-nepenthes.cpp"
      - "ggml/src/ggml-cpu/ggml-cpu.c"
      - "ggml/src/ggml-backend.cpp"
      - "ggml/src/ggml-cuda/ggml-cuda.cu"
      - "ggml/src/CMakeLists.txt"
      - "src/nepenthes_jsonl_sink.hpp"
      - "src/llama-context.cpp"
      - "src/llama-moe-cache.cpp"
      - "src/llama-kv-cache.cpp"
      - "tools/server/server-context.cpp"
      - "tests/nepenthes/**"
      - "docs/nepenthes-runtime-trace.md"
      - ".github/workflows/nepenthes-trace.yml"
  push:
    branches: [master, 'nepenthes/**']
    paths:
      - "src/nepenthes_trace.hpp"
      - "src/llama-model.cpp"
      - "src/nepenthes_jsonl_sink.hpp"
      - "src/nepenthes_jsonl_sink.cpp"
      - "src/llama-model-loader.cpp"
      - "src/CMakeLists.txt"
      - "ggml/include/ggml-nepenthes.hpp"
      - "ggml/include/ggml-nepenthes-c.h"
      - "ggml/src/ggml-nepenthes.cpp"
      - "ggml/src/ggml-cpu/ggml-cpu.c"
      - "ggml/src/ggml-backend.cpp"
      - "ggml/src/ggml-cuda/ggml-cuda.cu"
      - "ggml/src/CMakeLists.txt"
      - "src/nepenthes_jsonl_sink.hpp"
      - "src/llama-context.cpp"
      - "src/llama-moe-cache.cpp"
      - "src/llama-kv-cache.cpp"
      - "tools/server/server-context.cpp"
      - "tests/nepenthes/**"
      - "docs/nepenthes-runtime-trace.md"
      - ".github/workflows/nepenthes-trace.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nepenthes-trace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trace-and-cpu-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          for source in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
            if [ -f "$source" ]; then
              sudo sed -i -e 's|http://archive.ubuntu.com|https://archive.ubuntu.com|g' \
                -e 's|http://security.ubuntu.com|https://security.ubuntu.com|g' \
                -e 's|http://azure.archive.ubuntu.com|https://azure.archive.ubuntu.com|g' \
                -e 's|http://ports.ubuntu.com|https://ports.ubuntu.com|g' "$source"
            fi
          done
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build libcurl4-openssl-dev pkg-config
      - name: Compile and run trace contract test
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread -Isrc -Iggml/include -Iinclude \
            tests/nepenthes/test_trace.cpp ggml/src/ggml-nepenthes.cpp -o /tmp/nepenthes-trace-test
          /tmp/nepenthes-trace-test
      - name: Compile and run bounded JSONL sink test
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread -Isrc -Iggml/include -Iinclude \
            tests/nepenthes/test_jsonl_sink.cpp ggml/src/ggml-nepenthes.cpp -o /tmp/nepenthes-jsonl-test
          /tmp/nepenthes-jsonl-test --keep-trace
      - name: Checkout shared LEONES importer and fixtures
        uses: actions/checkout@v4
        with:
          repository: robertosantosx2/LEONES
          ref: c2151bba23fb4a9a3d746e696283d4e599f2e332
          path: leones
      - name: Validate emitted JSONL with the shared importer
        run: |
          python3 leones/scripts/nepenthes_llama_trace_import.py nepenthes-jsonl-test.jsonl \
            --source llama.cpp --output /tmp/nepenthes-trace-summary.json
          python3 -m unittest discover -s leones/tests -p 'test_nepenthes_llama_trace_import.py'
      - name: Compile and run CPU worker bridge test
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread -Iggml/include -Iinclude \
            tests/nepenthes/test_cpu_bridge.cpp ggml/src/ggml-nepenthes.cpp -o /tmp/nepenthes-cpu-bridge-test
          /tmp/nepenthes-cpu-bridge-test
      - name: Configure CPU llama-server
        run: |
          cmake -S . -B build-nepenthes -G Ninja \
            -DGGML_CUDA=OFF \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_CURL=OFF \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build instrumented llama-server
        run: cmake --build build-nepenthes --target llama-server --parallel 2

  cuda-compile:
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:12.9.1-devel-ubuntu24.04
    steps:
      - name: Install build dependencies
        run: |
          for source in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
            if [ -f "$source" ]; then
              sed -i -e 's|http://archive.ubuntu.com|https://archive.ubuntu.com|g' \
                -e 's|http://security.ubuntu.com|https://security.ubuntu.com|g' \
                -e 's|http://azure.archive.ubuntu.com|https://azure.archive.ubuntu.com|g' \
                -e 's|http://ports.ubuntu.com|https://ports.ubuntu.com|g' "$source"
            fi
          done
          apt-get -o Acquire::Retries=3 update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake git libcurl4-openssl-dev pkg-config
      - uses: actions/checkout@v4
      - name: Prepare CUDA link stubs
        run: |
          test -f /usr/local/cuda/lib64/stubs/libcuda.so
          ln -sf libcuda.so /usr/local/cuda/lib64/stubs/libcuda.so.1
      - name: Configure CUDA llama-server
        run: |
          cmake -S . -B build-nepenthes-cuda \
            -DGGML_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES=86 \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_CURL=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,-rpath-link,/usr/local/cuda/lib64/stubs" \
            -DCMAKE_BUILD_TYPE=Release
      - name: Verify NVTX v3 is enabled for CUDA request markers
        run: |
          grep -q '^NEPENTHES_NVTX_INCLUDE_DIR:PATH=' build-nepenthes-cuda/CMakeCache.txt
          NVTX_INCLUDE_DIR="$(sed -n 's/^NEPENTHES_NVTX_INCLUDE_DIR:PATH=//p' build-nepenthes-cuda/CMakeCache.txt)"
          test -f "$NVTX_INCLUDE_DIR/nvtx3/nvToolsExt.h"
      - name: Build CUDA llama-server
        run: cmake --build build-nepenthes-cuda --target llama-server --parallel 2
